name: release

# Publish a tagged release to PyPI via Trusted Publishing (OIDC) and
# create a GitHub release with the build artefacts attached.
#
# Trigger: push a tag matching v*.*.* on the benchmark/ package, e.g.:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# Trusted Publishing setup:
#
#   1. On PyPI, add this repo + workflow as a trusted publisher for
#      the `rpx-benchmark` project (Settings → Publishing → Add).
#   2. No API token needs to live in GitHub secrets — the OIDC token
#      minted by `id-token: write` is exchanged with PyPI at upload
#      time.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artefacts but skip publishing."
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub release
  id-token: write   # mint the OIDC token for PyPI trusted publishing

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm-style version derivation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Verify the built package imports cleanly
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import rpx_benchmark; print(rpx_benchmark.__name__)"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: benchmark/dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/rpx-benchmark
    steps:
      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — trusted publishing uses the OIDC token
        # automatically. Configure the publisher on PyPI first.

  github_release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
