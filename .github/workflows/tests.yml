name: tests

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "benchmark/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Run every Python change against the full offline test suite.
# No torch, no HuggingFace network — the suite runs in a few seconds
# across the matrix.

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install toolkit with dev + optional extras
        # Pull the `schemas` and `hf-datasets` extras so the matching
        # test modules don't silently importorskip out of CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,schemas,hf-datasets]'

      - name: Run pytest with coverage
        run: |
          pytest tests/ -q --strict-markers \
            --cov=rpx_benchmark \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: benchmark/coverage.xml

  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff + black
        run: python -m pip install 'ruff>=0.4' 'black>=24.8'

      - name: Ruff check (pyproject-configured rules)
        run: ruff check rpx_benchmark tests scripts

      - name: Ruff format check
        run: ruff format --check rpx_benchmark tests scripts
        continue-on-error: true   # advisory until we run `ruff format` across the tree

      - name: Black format check
        run: black --check rpx_benchmark tests scripts
        continue-on-error: true   # advisory — same reason as above

  typecheck:
    name: mypy (strict modules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolkit + mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,schemas,hf-datasets]'

      - name: Mypy (uses [tool.mypy] overrides in pyproject.toml)
        # The strict overlay is scoped in pyproject.toml; running mypy
        # on the whole package picks up the override block for the
        # stable-surface modules.
        run: mypy rpx_benchmark
