name: tests

on:
  push:
    branches: [main, naren/all]
    paths:
      - "benchmark/**"
      - "data/mask_annotation/**"
      - "tools/**"
      - "docker/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, naren/all]
    paths:
      - "benchmark/**"
      - "data/mask_annotation/**"
      - "tools/**"
      - "docker/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Run every Python change against the full offline test suite.
# Tests use CPU PyTorch and synthetic fixtures; no model weights are downloaded.

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install toolkit with dev + optional extras
        # Pull the `schemas` and `hf-datasets` extras so the matching
        # test modules don't silently importorskip out of CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,hub,schemas,hf-datasets,analysis,ar-pose-audit]' imageio imageio-ffmpeg av transformers build

      - name: Install CPU PyTorch for adapter contract tests
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned tracking evaluator
        run: python -m pip install --no-deps 'git+https://github.com/JonathonLuiten/TrackEval.git@12c8791b303e0a0b50f753af204249e622d0281a'

      - name: Run pytest with coverage
        run: |
          pytest tests/ -q --strict-markers \
            --cov=rpx_benchmark \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Annotation regression tests
        run: python -m pytest ../data/mask_annotation/visual_grounding_gt/vqa_gt/tests -q

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: benchmark/coverage.xml

  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff + black
        run: python -m pip install 'ruff>=0.4' 'black>=24.8'

      - name: Ruff check (pyproject-configured rules)
        run: ruff check rpx_benchmark tests scripts

      - name: Ruff format check
        run: ruff format --check rpx_benchmark tests scripts
        continue-on-error: true   # advisory until we run `ruff format` across the tree

      - name: Black format check
        run: black --check rpx_benchmark tests scripts
        continue-on-error: true   # advisory — same reason as above

  typecheck:
    name: mypy (strict modules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolkit + mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,hub,schemas,hf-datasets,analysis,ar-pose-audit]' imageio imageio-ffmpeg av transformers build

      - name: Mypy (uses [tool.mypy] overrides in pyproject.toml)
        # The strict overlay is scoped in pyproject.toml; running mypy
        # on the whole package picks up the override block for the
        # stable-surface modules.
        run: mypy rpx_benchmark
