name: documentation

on:
  push:
    branches: [main, naren/all]
    paths:
      - "README.md"
      - "mkdocs.yml"
      - "benchmark/**"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install toolkit and documentation dependencies
        run: python -m pip install -e './benchmark[hub,schemas,hf-datasets,docs]'
      - name: Build toolkit API pages
        run: python tools/docs/build_pages.py --output _site
      - name: Verify published entry points
        run: |
          test -s _site/toolkit-docs/index.html
          grep -q 'RPX Toolkit' _site/toolkit-docs/index.html
          test -s _site/toolkit-docs/metrics/index.html
          test -s _site/toolkit-docs/tasks/index.html
          test -s _site/toolkit-docs/rpx_benchmark/hub.html
          test ! -e _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
