[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpx-benchmark"
version = "0.1.0"
description = "RPX — choose and rank perception models for robot learning on real-world RGB-D data"
authors = [{name = "RPX Team"}]
maintainers = [{name = "RPX Team"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
  "robot-learning",
  "perception",
  "rgb-d",
  "benchmark",
  "monocular-depth",
  "segmentation",
  "robotics",
  "embodied-ai",
  "huggingface",
  "deployment-readiness",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
]

[project.optional-dependencies]
hub = [
  "huggingface_hub[hf_xet]>=0.26",
]
ui = [
  "rich>=13.7",
]
depth-hf = [
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.45",
  "accelerate>=0.30",
]
# UniDepth ships via GitHub, not PyPI. The dependency list below covers
# its transitive needs; the `unidepth` package itself must be installed
# with: pip install 'unidepth @ git+https://github.com/lpiccinelli-eth/UniDepth.git'
depth-unidepth = [
  "rpx-benchmark[depth-hf]",
  "einops>=0.7",
  "timm>=1.0",
  "huggingface_hub>=0.22",
]
# Metric3D needs mmcv (or mmcv-lite for CPU-only installs) + mmengine
# + timm. Note: Metric3D *inference* hardcodes device='cuda' in the
# decoder, so a CUDA-capable host is required at run time.
depth-metric3d = [
  "rpx-benchmark[depth-hf]",
  "timm>=1.0",
  "mmcv-lite>=2.1",
  "mmengine>=0.10",
]
depth = [
  "rpx-benchmark[depth-hf,ui]",
]
depth-all = [
  "rpx-benchmark[depth-hf,ui,depth-unidepth,depth-metric3d]",
]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10.8",
]

[project.scripts]
rpx = "rpx_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/IRVLUTD/RPX"
Documentation = "https://irvlutd.github.io/RPX/"
Repository = "https://github.com/IRVLUTD/RPX"
Issues = "https://github.com/IRVLUTD/RPX/issues"
Changelog = "https://github.com/IRVLUTD/RPX/blob/main/benchmark/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["rpx_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E9",   # syntax errors
  "F63",  # invalid assert patterns
  "F7",   # misc logic errors
  "F82",  # undefined names
  "F401", # unused imports
]
ignore = [
  "E402", # module-level import not at top (we allow this in __init__ files)
]
