[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpx-benchmark"
version = "0.3.0"
description = "RPX — benchmark harness for evaluating robot-perception models on real-world RGB-D data"
authors = [{name = "RPX Team"}]
maintainers = [{name = "RPX Team"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
  "robot-learning",
  "perception",
  "rgb-d",
  "benchmark",
  "robotics",
  "embodied-ai",
  "huggingface",
  "deployment-readiness",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
]

[project.optional-dependencies]
# HuggingFace Hub snapshot downloads (modality-aware bulk fetch),
# packing capture trees into per-modality tar shards, and writing the
# per-frame Parquet manifest the dataset hub ships.
hub = [
  "huggingface_hub[hf_xet]>=0.26",
  "pyarrow>=14",
]
# One-line `datasets.load_dataset(...)` + PyTorch DataLoader bridge.
hf-datasets = [
  "datasets>=2.18",
  "huggingface_hub>=0.22",
]
# Strict manifest validation.
schemas = [
  "pydantic>=2.5",
]
# Optional fast-path for ESD feature extraction (PNG decode 2-5× over PIL).
esd-fast = [
  "opencv-python>=4.8",
]
# Exploratory analysis of ESD features (analyze_esd.py): PCA, k-means, GMM,
# correlation tests, plots. Heavy deps kept out of the core install.
analysis = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]
# Interactive Rerun visualization of a (scene, phase) time series — RGB,
# depth, fisheye stereo, masks, and the T265 trajectory. Use `make visualize`.
viz = [
  "rerun-sdk>=0.26",
  "matplotlib>=3.7",
  "pillow>=10",
  "tqdm>=4.66",
]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "ruff>=0.4",
  "black>=24.8",
  "mypy>=1.11,<2.0",  # 2.0 tightened global defaults; the team's strict-modules-only policy assumes 1.x semantics
  "pre-commit>=3.8",
  "pydantic>=2.5",
  "types-requests",   # box_upload.py uses requests; mypy emits import-untyped without stubs
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10.8",
]

[project.urls]
Homepage = "https://github.com/IRVLUTD/RPX"
Documentation = "https://irvlutd.github.io/RPX/"
Repository = "https://github.com/IRVLUTD/RPX"
Issues = "https://github.com/IRVLUTD/RPX/issues"
Changelog = "https://github.com/IRVLUTD/RPX/blob/main/benchmark/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["rpx_benchmark*"]

[tool.setuptools.package-data]
rpx_benchmark = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["rpx_benchmark"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E9",   # syntax errors
  "F63",  # invalid assert patterns
  "F7",   # misc logic errors
  "F82",  # undefined names
  "F401", # unused imports
  "I",    # isort: import sorting
  "B",    # bugbear: likely bugs
]
ignore = [
  "E402", # module-level import not at top
  "B008", # function calls in default args (fine for dataclasses)
]

[tool.ruff.lint.isort]
known-first-party = ["rpx_benchmark"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "rpx_benchmark.api",
  "rpx_benchmark.schemas",
  "rpx_benchmark.exceptions",
  "rpx_benchmark.determinism",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
strict = true
# Silence error codes that catch a class of issues we can't fix
# without invasive churn:
#   type-arg     — np.ndarray annotations don't carry generic args
#                  (numpy's PEP 696 support came after these dataclasses
#                  shipped); a typing pass should switch to `NDArray` aliases.
#   arg-type     — pydantic v2 + ConfigDict generics interplay.
#   assignment   — Field(default_factory=...) widens declared type.
disable_error_code = ["type-arg", "arg-type", "assignment", "unused-ignore"]


# Also silence `attr-defined` re-export errors from __init__ — these
# come from modules without explicit `__all__`, which is a separate
# typing-pass cleanup item.
[[tool.mypy.overrides]]
module = ["rpx_benchmark"]
disable_error_code = ["attr-defined"]

# Tracked separately for the typing pass — modules that pre-date the
# `[no-untyped-def]` policy and modules with heavy generic-shape
# inference that aren't worth annotating until the toolkit's typing
# story stabilises. Keeping these out of mypy lets the strict overlay
# above stay informative without the rest of the codebase drowning
# the signal.
[[tool.mypy.overrides]]
module = [
  # Toolkit modules with pre-existing untyped defs (earlier work)
  "rpx_benchmark.adapters.base",
  "rpx_benchmark.deployment",
  "rpx_benchmark.drs_sensitivity",
  "rpx_benchmark.evaluators",
  "rpx_benchmark.profiler",
  "rpx_benchmark.runner",
  "rpx_benchmark.reports",
  "rpx_benchmark.loader",
  "rpx_benchmark.hub",
  "rpx_benchmark.logging_utils",
  "rpx_benchmark.data.*",
  "rpx_benchmark.metrics.*",
  "rpx_benchmark.tasks.*",
  "rpx_benchmark.dataset_hub.*",
  # New batched-dispatch + alignment modules — annotated minimally,
  # full type pass is a TODO alongside the rest of the codebase.
  "rpx_benchmark.adapters.batched_depth",
  "rpx_benchmark.adapters.batched_multimodal",
]
ignore_errors = true
